name: Publicar portfólio no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/css _site/js
          cp index.html _site/index.html
          cp css/portfolio.css _site/css/portfolio.css
          cp js/main.js _site/js/main.js
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/css/portfolio.css
          test -s _site/js/main.js

          echo "Arquivos preparados:"
          find _site -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Aguardar disponibilidade do artefato
        run: sleep 5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
