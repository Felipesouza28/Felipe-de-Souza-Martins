name: Publicar portfólio no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Reconstruir arquivos do site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat portfolio-source/part-*.b64 > /tmp/portfolio.tar.gz.b64
          base64 --decode /tmp/portfolio.tar.gz.b64 | tar -xz -C _site

          echo "Arquivos extraídos (até 4 níveis):"
          find _site -maxdepth 4 -type f | sort | head -80

          # GitHub Pages precisa encontrar o index.html na raiz do artefato.
          if [ ! -f _site/index.html ]; then
            nested_index="$(find _site -mindepth 2 -type f -name index.html -print -quit)"
            if [ -n "$nested_index" ]; then
              nested_root="$(dirname "$nested_index")"
              echo "index.html encontrado em $nested_root; movendo o conteúdo para a raiz."
              cp -a "$nested_root"/. _site/
            else
              echo "::error::index.html não foi encontrado no pacote do portfólio."
              exit 1
            fi
          fi

          if [ ! -f _site/js/main.js ]; then
            echo "::error::js/main.js não foi encontrado na raiz publicada."
            exit 1
          fi

          base64 --decode portfolio-source/briefing-enhancement.js.gz.b64 | gzip -dc >> _site/js/main.js
          touch _site/.nojekyll
          echo "Homepage pronta: _site/index.html"
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
