name: Publicar portfólio no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Reconstruir arquivos do site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat portfolio-source/part-*.b64 > /tmp/portfolio.tar.gz.b64
          base64 --decode /tmp/portfolio.tar.gz.b64 | tar -xz -C _site

          # O artefato precisa ter o index.html na raiz.
          if [ ! -f _site/index.html ]; then
            nested_index="$(find _site -mindepth 2 -type f -name index.html -print -quit)"
            if [ -z "$nested_index" ]; then
              echo "::error::index.html não foi encontrado no pacote do portfólio."
              exit 1
            fi
            nested_root="$(dirname "$nested_index")"
            cp -a "$nested_root"/. _site/
          fi

          if [ ! -f _site/js/main.js ]; then
            echo "::error::js/main.js não foi encontrado."
            exit 1
          fi

          base64 --decode portfolio-source/briefing-enhancement.js.gz.b64 | gzip -dc >> _site/js/main.js
          touch _site/.nojekyll

      # Mantém também uma versão estática na raiz da branch main.
      # Isso evita que o GitHub Pages exiba o README caso esteja configurado
      # para publicar a branch em vez do artefato do GitHub Actions.
      - name: Sincronizar site na raiz do repositório
        shell: bash
        run: |
          set -euo pipefail
          rm -rf css js
          cp -a _site/index.html _site/.nojekyll .
          cp -a _site/css _site/js .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll css js
          if git diff --cached --quiet; then
            echo "A raiz do repositório já está sincronizada."
          else
            git commit -m "build: sincroniza arquivos do site publicado"
            git push origin HEAD:main
          fi

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
